<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeSmart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container page-shell auth-shell">
        <section class="hero-panel">
            <div>
                <p class="eyebrow">Daily Operations</p>
                <h1>Login to Your Workspace</h1>
                <p class="hero-copy">Inventory managers get control over stock, alerts, and planning. Shopkeepers get a fast dashboard for daily sold updates.</p>
            </div>
        </section>

        <section class="panel auth-panel">
            <h2>Login</h2>
            <form class="stacked-form" onsubmit="loginUser(event)">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p class="auth-copy">Don't have an account? <a href="index.html">Register here</a></p>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
