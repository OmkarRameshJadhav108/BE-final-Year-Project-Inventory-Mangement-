<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TradeSmart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container page-shell auth-shell">
        <section class="hero-panel">
            <div>
                <p class="eyebrow">Smart Inventory Setup</p>
                <h1>Create Your TradeSmart Account</h1>
                <p class="hero-copy">Register as an inventory manager or shopkeeper and get the dashboard built for your daily work.</p>
            </div>
        </section>

        <section class="panel auth-panel">
            <h2>Register</h2>
            <form class="stacked-form" onsubmit="registerUser(event)">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <select id="role" required>
                    <option value="inventory_manager">Inventory Manager (Retailer)</option>
                    <option value="big_retailer">Big Retailer (Multi-Shop)</option>
                    <option value="shopkeeper">Shopkeeper</option>
                    <option value="manufacturer">Manufacturer Team</option>
                </select>
                <button type="submit">Create Account</button>
            </form>
            <p class="auth-copy">Already have an account? <a href="login.html">Login here</a></p>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
